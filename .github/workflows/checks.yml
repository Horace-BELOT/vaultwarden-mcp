name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: pyproject.toml # [tool.uv] required-version; Python from .python-version
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run vulture

  test:
    # The README covers Linux, macOS and Windows: tests run on all three, with a real `bw`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: pyproject.toml
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @bitwarden/cli
      - run: bw --version
      - run: uv sync --locked
      - run: uv run pytest -q -rs
